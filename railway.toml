[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Attach a Railway volume mounted at /data and set DATABASE_PATH=/data/bookings.db,
# otherwise every redeploy wipes the bookings you have already confirmed.
